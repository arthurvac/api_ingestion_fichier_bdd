services:
  db:
    image: postgres:17-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ingestion_db}
      POSTGRES_USER: ${POSTGRES_USER:-ingestion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ingestion_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ingestion]
  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ingestion_user:ingestion_dev_password@db:5432/ingestion_db}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_XLSX_UNCOMPRESSED_BYTES: ${MAX_XLSX_UNCOMPRESSED_BYTES:-52428800}
      MAX_ROWS: ${MAX_ROWS:-100000}
      MAX_COLUMNS: ${MAX_COLUMNS:-256}
      MAX_HEADER_ROWS: ${MAX_HEADER_ROWS:-20}
      MAX_RECORD_BYTES: ${MAX_RECORD_BYTES:-1048576}
      MAX_ERRORS: ${MAX_ERRORS:-50}
      MAX_ACTIVE_UPLOADS: ${MAX_ACTIVE_UPLOADS:-2}
      IMPORT_TIMEOUT_SECONDS: ${IMPORT_TIMEOUT_SECONDS:-900}
      DATABASE_LOCK_TIMEOUT_SECONDS: ${DATABASE_LOCK_TIMEOUT_SECONDS:-5}
    mem_limit: "${API_MEMORY_LIMIT_MIB:-2048}m"
    memswap_limit: "${API_MEMORY_LIMIT_MIB:-2048}m"
    cpus: "${API_CPU_LIMIT:-1.0}"
    volumes:
      - ingestion_tmp:/service/tmp
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [ingestion]
volumes:
  postgres_data:
  ingestion_tmp:
networks:
  ingestion:
