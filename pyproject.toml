[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api-ingestion-fichier-bdd"
version = "1.0.0"
description = "API locale d’ingestion CSV/XLSX vers PostgreSQL"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic[email]>=2.10,<3",
  "pydantic-settings>=2.7,<3", "SQLAlchemy>=2.0.38,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "openpyxl>=3.1.5,<4", "python-multipart>=0.0.20,<1",
  "defusedxml>=0.7.1,<1", "charset-normalizer>=3.4,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "black>=25.1,<27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = "(/\\.venv/|/data/)"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: nécessite PostgreSQL de test", "reference: utilise les quatre sources locales en lecture seule"]
